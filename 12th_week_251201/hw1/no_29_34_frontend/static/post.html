<!DOCTYPE html>
<head>
  <title>커뮤니티 샘플</title>
  <link rel="favicon" href="./favicon.ico" />
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="modal.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header>커뮤니티 샘플 페이지</header>
    <main id="post-container">
      <div class="post-frame">
        <div class="post-header">
          <button class="back-btn" onclick="backTo()">←</button>
          <div id="user-id"></div>
        </div>
        <div class="post-main">
          <img id="user-img" />
          <div class="post-contents">
            <div class="user-post">
              <div id="post-title"></div>
              <div id="post-body"></div>
            </div>
            <div class="post-reply-title">
              <span>댓글</span>
            </div>
            <div id="post-reply"></div>
          </div>
        </div>
        <div class="post-footer">
          <button id="write-reply" onclick="openModel()">댓글 작성</button>
        </div>
      </div>
    </main>
    <footer>2025 KTB 3기 샘플 테스트</footer>

    <!-- 모달 -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">댓글 작성</div>
          <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
          <textarea id="reply-area" cols="40" rows="5" placeholder="여기에 댓글을 작성해주세요"></textarea>
        </div>
        <div class="modal-footer">
          <button type="submit" onclick="registerReply()">댓글 등록하기</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const reply = []
    function backTo() {
      window.location.href = "/"
    }

    // 모달 관련 script
    function openModel() {
      const modal = document.getElementById('modal');
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('active');
    }
    
    function formatDateTime() {
      const now = new Date();
      
      const year = now.getFullYear();
      const month = ('0' + (now.getMonth() + 1)).slice(-2);  // 0~11이므로 +1
      const day = ('0' + now.getDate()).slice(-2);
      const hours = ('0' + now.getHours()).slice(-2);
      const minutes = ('0' + now.getMinutes()).slice(-2);
      const seconds = ('0' + now.getSeconds()).slice(-2);
      
      return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    function registerReply() {
      const textarea = document.getElementById('reply-area');
      const value = textarea.value; 
      console.log(value)

      // 댓글 등록
      const replyContainer = document.getElementById('post-reply');
      replyContainer.style.backgroundColor = 'transparent';
      reply.push(`
      <div class="reply-item">
        <div class="reply-content">${value}</div>
        <div class="reply-time">${formatDateTime()}</div>
      </div>`)
      let replyText = ''
      for (const item of reply) {
        replyText += item
      }
      replyContainer.innerHTML = replyText;

      closeModal()
    }

    window.addEventListener("load", async () => {
      try {
        const rawQuery = window.location.search.split("=")[1]
        const postId = parseInt(rawQuery) 
        if (Object.is(postId, NaN)) {
          console.log("error")
          throw TypeError("invalid post id")
        }
        const resp = await fetch(`https://jsonplaceholder.typicode.com/posts/${postId}`)
        const jsonData = await resp.json()
        const userId = document.getElementById('user-id');
        const userImg = document.getElementById('user-img');
        const postTitle = document.getElementById('post-title');
        const postBody = document.getElementById('post-body');

        userImg.src = "https://placehold.co/400"
        userId.textContent = `user id : ${jsonData.userId}`
        postTitle.textContent = jsonData.title
        postBody.textContent = jsonData.body

        // 댓글
        const replyContainer = document.getElementById('post-reply');
        
        if (reply.length == 0) {
          // replyContainer.textContent = "댓글이 아직 없습니다"
          replyContainer.innerHTML = `
            <div class="empty-reply">댓글이 아직 없습니다</div>
          `
        }
      } catch (error) {
        console.log(error)
        history.replaceState(null, '', '/error');
        window.location.href = '/error';
      }
    })
  </script>
</body>
